<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro · Institución</title>
  <link rel="stylesheet" href="../Styles/style.css">
</head>
<body class="google-login-page google-register-page">

  <main class="google-login-card google-register-card" aria-labelledby="register-title">
    <div class="google-login-eyebrow-row">
      <a class="google-login-back" href="../../index.html" aria-label="Volver al inicio">gister-title">Crear cuenta</h1>
    <p class="google-login-description">Completa tus datos para crear una cuenta.</p>

    <form class="google-register-form" action="#" method="post">
      <label>Nombre
        <input type="text" name="nombre" placeholder="Juan">
      </label>
      <label>Apellidos
        <input type="text" name="apellidos" placeholder="Pérez Gómez">
      </label>
      <label>Tipo de documento
        <select name="tipo_documento">
          <option>Cédula de ciudadanía</option>
          <option>Tarjeta de identidad</option>
          <option>Cédula de extranjería</option>
        </select>
      </label>
      <label>Documento
        <input type="text" name="documento" placeholder="1020304050">
      </label>
      <label>Fecha de nacimiento
        <input type="date" name="fecha_nacimiento">
      </label>
      <label>Celular
        <input type="tel" name="celular" placeholder="300 000 0000">
      </label>
      <label class="google-register-full">Correo electrónico
        <input type="email" name="email" placeholder="usuario@institucion.edu.co">
      </label>
      <label>Contraseña
        <input type="password" name="contrasena" placeholder="Mínimo 8 caracteres">
      </label>
      <label>Confirmar contraseña
        <input type="password" name="confirmar_contrasena" placeholder="Repite la contraseña">
      </label>
      <a href="../Pages/index.html" class="google-login-submit google-register-full">Crear cuenta</a>
    </form>

    <p class="google-login-note">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
  </main>

</body>
</html>
