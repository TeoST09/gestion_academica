<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Institución</title>
  <link rel="stylesheet" href="../Styles/style.css">
</head>
<body class="google-login-page">

  <main class="google-login-card" aria-labelledby="login-title">
    <div class="google-login-eyebrow-row">
      <a class="google-login-back" href="../Pages/index.html" aria-label="Volver al inicio">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m15 18-6-6 6-6M9 12h12" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
      </a>
      <p class="google-login-eyebrow">Acceso a tu cuenta</p>
    </div>
    <h1 id="login-title">¡Bienvenido de nuevo!</h1>
    <p class="google-login-description">Ingresa con tu correo y contraseña.</p>

    <form class="google-login-form" action="#" method="post">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" name="email" placeholder="usuario@institucion.edu.co" autocomplete="email" required>

      <label for="password">Contraseña</label>
      <input id="password" type="password" name="contrasena" placeholder="Tu contraseña" autocomplete="current-password" required>

      <label class="google-login-remember">
        <input type="checkbox" name="recordarme">
        <span>Recordarme</span>
      </label>

      <button class="google-login-submit" type="submit">Iniciar sesión</button>
    </form>

    <p class="google-login-note">¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
  </main>

  <script>
    document.querySelector(".google-login-form").addEventListener("submit", function (event) {
      event.preventDefault();
      window.location.assign("../Admin/admin.html");
    });
  </script>

</body>
</html>
